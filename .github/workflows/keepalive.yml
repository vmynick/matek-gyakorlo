# Ébresztő a Supabase projektnek: az ingyenes csomag 7 nap használat nélkül szünetel (pl. nyári szünetben).
# Hetente kétszer meghív egy apró adatbázis-függvényt. A cím és a publishable kulcs nyilvános (config.js).
name: Supabase ébresztő

on:
  schedule:
    - cron: '17 6 * * 1,4' # hétfőn és csütörtökön reggel
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          curl -fsS -X POST "https://yqnlpzhmfrnzmvakjdyq.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_eNoNBeDeJYUrpIEQPOohtw_U7KMvCUm" \
            -H "Content-Type: application/json" -d '{}'
